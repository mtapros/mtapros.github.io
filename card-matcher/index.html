<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Card Matcher v4</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee}
header{padding:12px 16px;background:#1c1c1c;border-bottom:1px solid #333}
header h1{font-size:18px;margin:0}
#stat{font-size:12px;color:#aaa;margin-top:4px}
main{padding:12px 16px;max-width:900px;margin:auto}
.btn{display:block;width:100%;padding:18px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#2d7ef7;color:#fff;margin:8px 0;cursor:pointer}
.btn:disabled{background:#444;color:#888}
.row{display:flex;gap:8px}
.row .btn{font-size:15px;padding:12px;background:#333}
#unsureRow{display:none}
#unsureRow .btn{background:#a06a00}
#result{margin:12px 0;padding:16px;border-radius:12px;background:#222;font-size:22px;font-weight:700;text-align:center;min-height:64px}
#result.new{background:#1f6f3f}
#result.match{background:#2d4f9f}
#result.unsure{background:#8a6400}
#result.fail{background:#8a2c2c}
.detail{font-size:13px;color:#ddd;font-weight:400;margin-top:6px}
#views{display:flex;gap:8px;margin:10px 0}
#views div{flex:1;text-align:center;font-size:12px;color:#999}
#views canvas{width:100%;max-height:240px;object-fit:contain;background:#000;border-radius:8px}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.g{background:#222;border-radius:10px;padding:8px;text-align:center;border:2px solid transparent}
.g.hit{border-color:#ffcc00}
.g img{width:100%;border-radius:6px}
.g .n{font-size:22px;font-weight:800}
.g .c{font-size:13px;color:#aaa}
label{font-size:13px;color:#bbb;display:block;margin-top:8px}
input[type=range]{width:100%}
#log{font-family:monospace;font-size:11px;color:#888;white-space:pre-wrap;max-height:200px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:8px}
h2{font-size:15px;margin:18px 0 6px;color:#ccc}
details{margin-top:10px;color:#bbb}
</style>
</head>
<body>
<header><h1>Card Matcher v4 · align + weighted compare</h1><div id="stat">Loading OpenCV…</div></header>
<main>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<button class="btn" id="snap" disabled>📷 Photograph Card</button>
<div class="row" id="unsureRow">
<button class="btn" id="acceptBest">Yes, it's Group ?</button>
<button class="btn" id="makeNew">No, new card</button>
</div>
<div class="row">
<button class="btn" id="undo">Undo last</button>
<button class="btn" id="reset">Reset all</button>
</div>
<div id="result">Take a photo of a card to begin</div>
<div id="views">
<div><canvas id="cIn"></canvas>Outline</div>
<div><canvas id="cWarp"></canvas>Aligned onto closest</div>
<div><canvas id="cMap"></canvas>Weighted difference</div>
</div>
<details>
<summary>Tuning</summary>
<label>REPEAT if best score ≥ <b id="hiv">0.94</b></label>
<input type="range" id="hi" min="80" max="99" value="94">
<label>NEW if best score &lt; <b id="lov">0.90</b> (between = UNSURE)</label>
<input type="range" id="lo" min="60" max="98" value="90">
<label>REPEAT also needs a lead over runner-up of ≥ <b id="mgv">0.03</b></label>
<input type="range" id="mg" min="0" max="15" value="3">
<label><input type="checkbox" id="useDetect" checked> Auto-detect card edges</label>
</details>
<h2>Groups (<span id="gcount">0</span>) · Cards: <span id="total">0</span> · Unsure: <span id="unsureCount">0</span></h2>
<div id="groups"></div>
<h2>Log</h2>
<div id="log"></div>
</main>
<script>
const W=400,H=560,FW=96,FH=134,MAXDIM=1200,MAX_SAMPLES=4,MIN_INL=12;
let groups=[],history=[],pending=null,unsureCount=0,busy=false,orb,bf,WT=null;
const $=id=>document.getElementById(id);
function log(s){$('log').textContent=new Date().toLocaleTimeString()+'  '+s+'\n'+$('log').textContent;}
function stat(s){$('stat').textContent=s;}
function errStr(e){if(e==null)return 'unknown error';if(typeof e==='number')return 'OpenCV error code '+e;if(typeof e==='string')return e;return e.message||String(e);}
[['hi',100],['lo',100],['mg',100]].forEach(([id,d])=>{$(id).oninput=e=>{$(id+'v').textContent=(e.target.value/d).toFixed(2);};});
function onCvReady(){orb=new cv.ORB(1000);bf=new cv.BFMatcher(cv.NORM_HAMMING,false);stat('Ready');$('snap').disabled=false;log('Ready (v4: ORB alignment + learned weighting)');}
function cvLoaded(){if(cv instanceof Promise){cv.then(m=>{window.cv=m;onCvReady();});}else if(cv.Mat){onCvReady();}else{cv['onRuntimeInitialized']=onCvReady;}}
$('snap').onclick=()=>{if(!busy)$('file').click();};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{busy=true;$('snap').disabled=true;setTimeout(()=>{try{processImg(img);}catch(err){log('ERROR '+errStr(err)+(err&&err.stack?'\n'+err.stack:''));$('result').className='fail';$('result').innerHTML='Error<div class="detail">'+errStr(err)+'</div>';}busy=false;$('snap').disabled=false;URL.revokeObjectURL(img.src);$('file').value='';},30);};
  img.src=URL.createObjectURL(f);
};
function orderPts(p){const s=p.map(q=>q.x+q.y),d=p.map(q=>q.y-q.x);return [p[s.indexOf(Math.min(...s))],p[d.indexOf(Math.min(...d))],p[s.indexOf(Math.max(...s))],p[d.indexOf(Math.max(...d))]];}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function findCard(src){
  const g=new cv.Mat(),e=new cv.Mat(),cs=new cv.MatVector(),hi=new cv.Mat();
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,g,new cv.Size(5,5),0);cv.Canny(g,e,40,120);
  const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));cv.dilate(e,e,k);
  cv.findContours(e,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  const minA=src.rows*src.cols*0.08;let best=null,bestA=0;
  for(let i=0;i<cs.size();i++){
    const c=cs.get(i),a=cv.contourArea(c);
    if(a<minA||a<=bestA){c.delete();continue;}
    const ap=new cv.Mat();cv.approxPolyDP(c,ap,0.02*cv.arcLength(c,true),true);
    let pts;
    if(ap.rows===4&&cv.isContourConvex(ap)){pts=[];for(let j=0;j<4;j++)pts.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]});}
    else{pts=cv.RotatedRect.points(cv.minAreaRect(c)).map(q=>({x:q.x,y:q.y}));}
    best=pts;bestA=a;ap.delete();c.delete();
  }
  g.delete();e.delete();cs.delete();hi.delete();k.delete();
  return best?orderPts(best):null;
}
function warpCard(src,pts){
  const [tl,tr,br,bl]=pts,landscape=dist(tl,tr)>dist(tl,bl);
  const dw=landscape?H:W,dh=landscape?W:H;
  const sM=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]);
  const dM=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,dw,0,dw,dh,0,dh]);
  const M=cv.getPerspectiveTransform(sM,dM),out=new cv.Mat();
  cv.warpPerspective(src,out,M,new cv.Size(dw,dh));sM.delete();dM.delete();M.delete();
  if(landscape)cv.rotate(out,out,cv.ROTATE_90_CLOCKWISE);
  return out;
}
function featOf(gray){
  const b=new cv.Mat(),s=new cv.Mat();
  cv.GaussianBlur(gray,b,new cv.Size(0,0),1.5);cv.resize(b,s,new cv.Size(FW,FH),0,0,cv.INTER_AREA);
  const n=FW*FH,f=new Float32Array(n);let m=0;for(let i=0;i<n;i++){f[i]=s.data[i];m+=f[i];}m/=n;
  let v=0;for(let i=0;i<n;i++){f[i]-=m;v+=f[i]*f[i];}v=Math.sqrt(v/n)||1;for(let i=0;i<n;i++)f[i]/=v;
  b.delete();s.delete();return f;
}
function describe(card){
  const gray=new cv.Mat();cv.cvtColor(card,gray,cv.COLOR_RGBA2GRAY);
  const kp=new cv.KeyPointVector(),des=new cv.Mat(),m=new cv.Mat();
  orb.detectAndCompute(gray,m,kp,des);
  const pts=[];for(let i=0;i<kp.size();i++){const p=kp.get(i).pt;pts.push([p.x,p.y]);}
  kp.delete();m.delete();
  return {gray,des,pts,feat:featOf(gray)};
}
function wcorr(a,b,w){
  const n=a.length;let sw=0,sa=0,sb=0;
  for(let i=0;i<n;i++){const x=w?w[i]:1;sw+=x;sa+=x*a[i];sb+=x*b[i];}
  const ma=sa/sw,mb=sb/sw;let cab=0,caa=0,cbb=0;
  for(let i=0;i<n;i++){const x=w?w[i]:1,da=a[i]-ma,db=b[i]-mb;cab+=x*da*db;caa+=x*da*da;cbb+=x*db*db;}
  return cab/Math.sqrt(caa*cbb+1e-12);
}
function updateWeights(){
  if(groups.length<3){WT=null;return;}
  const n=FW*FH,G=groups.length,s=new Float32Array(n),s2=new Float32Array(n);
  groups.forEach(g=>{const f=g.samples[0].feat;for(let i=0;i<n;i++){s[i]+=f[i];s2[i]+=f[i]*f[i];}});
  const m=cv.matFromArray(FH,FW,cv.CV_32F,Array.from(s2,(v,i)=>Math.max(v/G-(s[i]/G)**2,0)));
  const o=new cv.Mat();cv.GaussianBlur(m,o,new cv.Size(0,0),2);
  let mean=0;for(let i=0;i<n;i++)mean+=o.data32F[i];mean/=n;
  WT=new Float32Array(n);for(let i=0;i<n;i++)WT[i]=0.15+0.85*o.data32F[i]/(mean||1);
  m.delete();o.delete();
}
function alignScore(q,r){
  if(q.des.rows<10||r.des.rows<10)return {score:-1,inl:0};
  const mv=new cv.DMatchVectorVector();bf.knnMatch(q.des,r.des,mv,2);
  const a=[],b=[];
  for(let i=0;i<mv.size();i++){const m=mv.get(i);if(m.size()<2)continue;const m0=m.get(0),m1=m.get(1);if(m0.distance<0.8*m1.distance){a.push(...q.pts[m0.queryIdx]);b.push(...r.pts[m0.trainIdx]);}}
  mv.delete();
  const n=a.length/2;if(n<MIN_INL)return {score:-1,inl:0};
  const A=cv.matFromArray(n,1,cv.CV_32FC2,a),B=cv.matFromArray(n,1,cv.CV_32FC2,b),mask=new cv.Mat();
  let Hm=null,inl=0;
  try{Hm=cv.findHomography(A,B,cv.RANSAC,3,mask);inl=Hm.empty()?0:cv.countNonZero(mask);}catch(e){inl=0;}
  A.delete();B.delete();mask.delete();
  if(!Hm||Hm.empty()||inl<MIN_INL){if(Hm)Hm.delete();return {score:-1,inl};}
  const sz=new cv.Size(r.gray.cols,r.gray.rows),wq=new cv.Mat(),ones=new cv.Mat(q.gray.rows,q.gray.cols,cv.CV_8UC1,new cv.Scalar(255)),wm=new cv.Mat();
  cv.warpPerspective(q.gray,wq,Hm,sz);cv.warpPerspective(ones,wm,Hm,sz,cv.INTER_NEAREST);
  const comp=r.gray.clone();wq.copyTo(comp,wm);
  const f=featOf(comp);
  const score=wcorr(f,r.feat,WT);
  wq.delete();ones.delete();wm.delete();Hm.delete();
  return {score,inl,comp,f};
}
function drawDiff(f,rf){
  const c=$('cMap');c.width=FW*2;c.height=FH*2;const x=c.getContext('2d'),im=x.createImageData(FW,FH);
  for(let i=0;i<FW*FH;i++){const d=Math.min(255,Math.abs(f[i]-rf[i])*(WT?WT[i]:1)*90);im.data[i*4]=d;im.data[i*4+1]=d*0.35;im.data[i*4+2]=0;im.data[i*4+3]=255;}
  const t=document.createElement('canvas');t.width=FW;t.height=FH;t.getContext('2d').putImageData(im,0,0);
  x.imageSmoothingEnabled=false;x.drawImage(t,0,0,c.width,c.height);
}
let lastThumb=null;
function processImg(img){
  const t0=performance.now();$('unsureRow').style.display='none';pending=null;
  const sc=Math.min(1,MAXDIM/Math.max(img.width,img.height));
  const cIn=$('cIn');cIn.width=Math.round(img.width*sc);cIn.height=Math.round(img.height*sc);
  const ctx=cIn.getContext('2d');ctx.drawImage(img,0,0,cIn.width,cIn.height);
  const src=cv.imread(cIn);
  let pts=$('useDetect').checked?findCard(src):null;const detected=!!pts;
  if(!pts)pts=[{x:0,y:0},{x:src.cols,y:0},{x:src.cols,y:src.rows},{x:0,y:src.rows}];
  const card=warpCard(src,pts);
  const tc=document.createElement('canvas');cv.imshow(tc,card);
  const t2=document.createElement('canvas');t2.width=200;t2.height=280;t2.getContext('2d').drawImage(tc,0,0,200,280);lastThumb=t2.toDataURL('image/jpeg',0.8);
  ctx.strokeStyle=detected?'#00ff66':'#ff3333';ctx.lineWidth=6;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
  const q=describe(card);card.delete();src.delete();
  const R=$('result');
  if(q.des.rows<20){R.className='fail';R.innerHTML=`Not enough detail found<div class="detail">${q.des.rows} points · better light / closer</div>`;freeDesc(q);return;}
  const res=[];
  groups.forEach((g,gi)=>{
    let best={score:-1,inl:0};
    g.samples.forEach(r=>{const s=alignScore(q,r);if(s.score>best.score){if(best.comp)best.comp.delete();best=s;best.r=r;}else if(s.comp)s.comp.delete();});
    res.push({gi,...best});
  });
  res.sort((a,b)=>b.score-a.score);
  const best=res[0],second=res[1];
  if(best&&best.comp){cv.imshow($('cWarp'),best.comp);drawDiff(best.f,best.r.feat);}
  else{cv.imshow($('cWarp'),q.gray);const c=$('cMap');c.getContext('2d').clearRect(0,0,c.width,c.height);}
  res.forEach(x=>{if(x.comp)x.comp.delete();});
  const hi=$('hi').value/100,lo=$('lo').value/100,mg=$('mg').value/100;
  const ms=Math.round(performance.now()-t0);
  const fmt=x=>`G${groups[x.gi].id}: ${x.score<0?'no align':x.score.toFixed(3)} (${x.inl} pts)`;
  const top=res.slice(0,3).map(fmt).join('<br>');
  const lead=best?(best.score-(second?Math.max(second.score,0):0)):0;
  const info=`${ms} ms · ${groups.length} groups · weights ${WT?'learned':'off (<3 groups)'} · edges ${detected?'found':'NOT found'}<br>lead over runner-up ${best?lead.toFixed(3):'-'}<br>${top||'first card'}`;
  const logTop=top.replace(/<br>/g,' | ');
  if(!best||best.score<lo){
    const g=newGroup(q);history.push({type:'new',gid:g.id});
    R.className='new';R.innerHTML=`NEW CARD → Group ${g.id}<div class="detail">${info}</div>`;log(`NEW G${g.id} ${ms}ms | ${logTop}`);render(g.id);
  }else if(best.score>=hi&&lead>=mg){
    const g=groups[best.gi];addToGroup(g,q);history.push({type:'add',gid:g.id,q});
    R.className='match';R.innerHTML=`REPEAT → Group ${g.id}<div class="detail">${info}</div>`;log(`REPEAT G${g.id} ${ms}ms lead ${lead.toFixed(3)} | ${logTop}`);render(g.id);
  }else{
    const g=groups[best.gi];pending={q,gid:g.id};unsureCount++;
    R.className='unsure';R.innerHTML=`UNSURE — maybe Group ${g.id}?<div class="detail">(on the sorter this goes to the reject bin)<br>${info}</div>`;
    $('acceptBest').textContent=`Yes, it's Group ${g.id}`;$('unsureRow').style.display='flex';log(`UNSURE ~G${g.id} ${ms}ms lead ${lead.toFixed(3)} | ${logTop}`);render(g.id);
  }
}
function freeDesc(q){try{q.gray.delete();q.des.delete();}catch(e){}}
function newGroup(q){const id=groups.length?Math.max(...groups.map(g=>g.id))+1:1;const g={id,count:1,samples:[q],thumb:lastThumb};groups.push(g);updateWeights();return g;}
function addToGroup(g,q){g.count++;if(g.samples.length<MAX_SAMPLES)g.samples.push(q);}
$('acceptBest').onclick=()=>{if(!pending)return;const g=groups.find(x=>x.id===pending.gid);addToGroup(g,pending.q);history.push({type:'add',gid:g.id,q:pending.q});log('USER: unsure → G'+g.id);$('result').className='match';$('result').textContent='Added to Group '+g.id;pending=null;$('unsureRow').style.display='none';render(g.id);};
$('makeNew').onclick=()=>{if(!pending)return;const g=newGroup(pending.q);history.push({type:'new',gid:g.id});log('USER: unsure → NEW G'+g.id);$('result').className='new';$('result').textContent='Created Group '+g.id;pending=null;$('unsureRow').style.display='none';render(g.id);};
$('undo').onclick=()=>{
  const h=history.pop();if(!h)return;const gi=groups.findIndex(g=>g.id===h.gid);if(gi<0)return;const g=groups[gi];
  if(h.type==='new'){groups.splice(gi,1);updateWeights();}else{g.count--;const si=g.samples.indexOf(h.q);if(si>0)g.samples.splice(si,1);}
  $('result').className='';$('result').textContent='Undid last';log('UNDO G'+h.gid);render();
};
$('reset').onclick=()=>{if(!confirm('Clear all groups?'))return;groups=[];history=[];pending=null;unsureCount=0;WT=null;$('unsureRow').style.display='none';$('result').className='';$('result').textContent='Reset';render();log('RESET');};
function render(hit){
  const el=$('groups');el.innerHTML='';
  groups.forEach(g=>{const d=document.createElement('div');d.className='g'+(g.id===hit?' hit':'');d.innerHTML=`<div class="n">${g.id}</div><img src="${g.thumb}"><div class="c">${g.count} card${g.count>1?'s':''}</div>`;el.appendChild(d);});
  $('gcount').textContent=groups.length;$('total').textContent=groups.reduce((a,g)=>a+g.count,0);$('unsureCount').textContent=unsureCount;
}
</script>
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="cvLoaded()"></script>
</body>
</html>
