<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Card Matcher Prototype v2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee}
header{padding:12px 16px;background:#1c1c1c;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
#cvstat{font-size:12px;color:#aaa}
main{padding:12px 16px;max-width:900px;margin:auto}
.btn{display:block;width:100%;padding:18px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#2d7ef7;color:#fff;margin:8px 0;cursor:pointer}
.btn:disabled{background:#444;color:#888}
.row{display:flex;gap:8px}
.row .btn{font-size:15px;padding:12px;background:#333}
#result{margin:12px 0;padding:16px;border-radius:12px;background:#222;font-size:22px;font-weight:700;text-align:center;min-height:64px}
#result.new{background:#1f6f3f}
#result.match{background:#2d4f9f}
#result.fail{background:#8a2c2c}
#detail{font-size:13px;color:#bbb;font-weight:400;margin-top:6px}
#views{display:flex;gap:8px;margin:10px 0}
#views div{flex:1;text-align:center;font-size:12px;color:#999}
#views canvas{width:100%;max-height:240px;object-fit:contain;background:#000;border-radius:8px}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.g{background:#222;border-radius:10px;padding:8px;text-align:center;border:2px solid transparent}
.g.hit{border-color:#ffcc00}
.g img{width:100%;border-radius:6px}
.g .n{font-size:22px;font-weight:800}
.g input{width:100%;background:#111;color:#eee;border:1px solid #444;border-radius:6px;padding:4px;margin-top:4px;font-size:13px}
.g .c{font-size:13px;color:#aaa}
label{font-size:13px;color:#bbb;display:block;margin-top:6px}
input[type=range]{width:100%}
#log{font-family:monospace;font-size:11px;color:#888;white-space:pre-wrap;max-height:180px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:8px}
h2{font-size:15px;margin:18px 0 6px;color:#ccc}
</style>
</head>
<body>
<header><h1>Card Matcher v2</h1><span id="cvstat">Loading OpenCV…</span></header>
<main>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<button class="btn" id="snap" disabled>📷 Photograph Card</button>
<div class="row">
<button class="btn" id="undo">Undo last</button>
<button class="btn" id="forceNew">Last → new group</button>
<button class="btn" id="reset">Reset all</button>
</div>
<div id="result">Take a photo of a card to begin</div>
<div id="views">
<div><canvas id="cIn"></canvas>Outline</div>
<div><canvas id="cWarp"></canvas>Flattened</div>
<div><canvas id="cDiff"></canvas>Diff vs best</div>
</div>
<label>Alignment minimum (RANSAC inliers): <b id="thv">15</b></label>
<input type="range" id="th" min="6" max="80" value="15">
<label>Max difference for SAME card: <b id="dtv">12</b>%</label>
<input type="range" id="dt" min="2" max="40" value="12">
<label><input type="checkbox" id="useDetect" checked> Auto-detect card edges</label>
<h2>Groups (<span id="gcount">0</span>) · Cards scanned: <span id="total">0</span></h2>
<div id="groups"></div>
<h2>Log</h2>
<div id="log"></div>
</main>
<script>
const W=400,H=560,MAX_SAMPLES=3,MAXDIM=1200;
let groups=[],history=[],orb,bf,ready=false;
const $=id=>document.getElementById(id);
function log(s){const l=$('log');l.textContent=new Date().toLocaleTimeString()+'  '+s+'\n'+l.textContent;}
function onCvReady(){
  orb=new cv.ORB(1500);
  bf=new cv.BFMatcher(cv.NORM_HAMMING,false);
  ready=true;$('cvstat').textContent='OpenCV ready';$('snap').disabled=false;log('OpenCV loaded (v2: alignment + pixel diff)');
}
function loadCv(){
  const s=document.createElement('script');
  s.src='https://docs.opencv.org/4.8.0/opencv.js';s.async=true;
  s.onload=async()=>{
    if(cv instanceof Promise){cv=await cv;onCvReady();}
    else if(cv.Mat){onCvReady();}
    else{cv['onRuntimeInitialized']=onCvReady;}
  };
  s.onerror=()=>{$('cvstat').textContent='OpenCV failed to load (need internet)';};
  document.body.appendChild(s);
}
loadCv();
$('th').oninput=e=>{$('thv').textContent=e.target.value;};
$('dt').oninput=e=>{$('dtv').textContent=e.target.value;};
$('snap').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{process(img);URL.revokeObjectURL(img.src);$('file').value='';};
  img.src=URL.createObjectURL(f);
};
function orderPts(p){
  const s=p.map(q=>q.x+q.y),d=p.map(q=>q.y-q.x);
  const tl=p[s.indexOf(Math.min(...s))],br=p[s.indexOf(Math.max(...s))];
  const tr=p[d.indexOf(Math.min(...d))],bl=p[d.indexOf(Math.max(...d))];
  return [tl,tr,br,bl];
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function findCard(src){
  const g=new cv.Mat(),e=new cv.Mat(),cs=new cv.MatVector(),hi=new cv.Mat();
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);
  cv.GaussianBlur(g,g,new cv.Size(5,5),0);
  cv.Canny(g,e,40,120);
  const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));
  cv.dilate(e,e,k);
  cv.findContours(e,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  const minA=src.rows*src.cols*0.08;
  let best=null,bestA=0;
  for(let i=0;i<cs.size();i++){
    const c=cs.get(i),a=cv.contourArea(c);
    if(a<minA||a<=bestA){c.delete();continue;}
    const peri=cv.arcLength(c,true),ap=new cv.Mat();
    cv.approxPolyDP(c,ap,0.02*peri,true);
    let pts=null;
    if(ap.rows===4&&cv.isContourConvex(ap)){
      pts=[];for(let j=0;j<4;j++)pts.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]});
    }else{
      const r=cv.minAreaRect(c),v=cv.RotatedRect.points(r);
      pts=v.map(q=>({x:q.x,y:q.y}));
    }
    best=pts;bestA=a;ap.delete();c.delete();
  }
  g.delete();e.delete();cs.delete();hi.delete();k.delete();
  return best?orderPts(best):null;
}
function warpCard(src,pts){
  let [tl,tr,br,bl]=pts;
  const landscape=dist(tl,tr)>dist(tl,bl);
  const dw=landscape?H:W,dh=landscape?W:H;
  const sM=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]);
  const dM=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,dw,0,dw,dh,0,dh]);
  const M=cv.getPerspectiveTransform(sM,dM),out=new cv.Mat();
  cv.warpPerspective(src,out,M,new cv.Size(dw,dh));
  sM.delete();dM.delete();M.delete();
  if(landscape){cv.rotate(out,out,cv.ROTATE_90_CLOCKWISE);}
  return out;
}
function features(card){
  const gray=new cv.Mat();
  cv.cvtColor(card,gray,cv.COLOR_RGBA2GRAY);
  const g=gray.clone();
  const cl=new cv.CLAHE(2.0,new cv.Size(8,8));cl.apply(g,g);cl.delete();
  const kp=new cv.KeyPointVector(),des=new cv.Mat(),m=new cv.Mat();
  orb.detectAndCompute(g,m,kp,des);
  const pts=[];for(let i=0;i<kp.size();i++){const p=kp.get(i).pt;pts.push([p.x,p.y]);}
  g.delete();kp.delete();m.delete();
  return {des,pts,gray};
}
function diffFrac(qg,rg,Hm,show){
  const sz=new cv.Size(rg.cols,rg.rows);
  const wq=new cv.Mat(),ones=new cv.Mat(qg.rows,qg.cols,cv.CV_8UC1,new cv.Scalar(255)),wm=new cv.Mat();
  cv.warpPerspective(qg,wq,Hm,sz);cv.warpPerspective(ones,wm,Hm,sz);
  const s=new cv.Size(100,140),a=new cv.Mat(),b=new cv.Mat(),m=new cv.Mat();
  cv.resize(wq,a,s,0,0,cv.INTER_AREA);cv.resize(rg,b,s,0,0,cv.INTER_AREA);cv.resize(wm,m,s,0,0,cv.INTER_NEAREST);
  cv.GaussianBlur(a,a,new cv.Size(5,5),0);cv.GaussianBlur(b,b,new cv.Size(5,5),0);
  const A=a.data,B=b.data,M=m.data,N=A.length;
  let n=0,sa=0,sb=0,saa=0,sbb=0;
  for(let i=0;i<N;i++){if(M[i]>200){n++;sa+=A[i];sb+=B[i];saa+=A[i]*A[i];sbb+=B[i]*B[i];}}
  let frac=1;
  if(n>N*0.5){
    const ma=sa/n,mb=sb/n,da=Math.sqrt(Math.max(saa/n-ma*ma,1)),db=Math.sqrt(Math.max(sbb/n-mb*mb,1));
    let bad=0;const vis=show?new cv.Mat(140,100,cv.CV_8UC1,new cv.Scalar(0)):null;
    for(let i=0;i<N;i++){
      if(M[i]>200){
        const d=Math.abs((A[i]-ma)/da-(B[i]-mb)/db);
        if(d>1.0)bad++;
        if(vis)vis.data[i]=Math.min(255,Math.round(d*120));
      }
    }
    frac=bad/n;
    if(vis){const big=new cv.Mat();cv.resize(vis,big,new cv.Size(200,280),0,0,cv.INTER_NEAREST);cv.imshow($('cDiff'),big);big.delete();vis.delete();}
  }
  wq.delete();ones.delete();wm.delete();a.delete();b.delete();m.delete();
  return frac;
}
function align(q,r){
  if(q.des.rows<10||r.des.rows<10)return {inl:0,H:null};
  const mv=new cv.DMatchVectorVector();
  bf.knnMatch(q.des,r.des,mv,2);
  const a=[],b=[];
  for(let i=0;i<mv.size();i++){
    const m=mv.get(i);if(m.size()<2)continue;
    const m0=m.get(0),m1=m.get(1);
    if(m0.distance<0.8*m1.distance){a.push(...q.pts[m0.queryIdx]);b.push(...r.pts[m0.trainIdx]);}
  }
  mv.delete();
  const n=a.length/2;if(n<8)return {inl:0,H:null};
  const A=cv.matFromArray(n,1,cv.CV_32FC2,a),B=cv.matFromArray(n,1,cv.CV_32FC2,b),mask=new cv.Mat();
  let inl=0,Hm=null;
  try{Hm=cv.findHomography(A,B,cv.RANSAC,6,mask);if(Hm.empty()){Hm.delete();Hm=null;}else inl=cv.countNonZero(mask);}catch(err){Hm=null;}
  A.delete();B.delete();mask.delete();
  return {inl,H:Hm};
}
function thumb(card){
  const c=document.createElement('canvas');cv.imshow(c,card);
  const t=document.createElement('canvas');t.width=200;t.height=280;
  t.getContext('2d').drawImage(c,0,0,200,280);return t.toDataURL('image/jpeg',0.8);
}
function process(img){
  if(!ready)return;
  const t0=performance.now();
  const sc=Math.min(1,MAXDIM/Math.max(img.width,img.height));
  const cIn=$('cIn');cIn.width=Math.round(img.width*sc);cIn.height=Math.round(img.height*sc);
  const ctx=cIn.getContext('2d');ctx.drawImage(img,0,0,cIn.width,cIn.height);
  const src=cv.imread(cIn);
  let pts=$('useDetect').checked?findCard(src):null,detected=!!pts;
  if(!pts)pts=[{x:0,y:0},{x:src.cols,y:0},{x:src.cols,y:src.rows},{x:0,y:src.rows}];
  const card=warpCard(src,pts);
  cv.imshow($('cWarp'),card);
  ctx.strokeStyle=detected?'#00ff66':'#ff3333';ctx.lineWidth=6;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
  const f=features(card);
  const R=$('result');
  if(f.des.rows<10){
    R.className='fail';R.innerHTML=`Not enough detail found<div id="detail">${f.des.rows} keypoints · try better light / closer</div>`;
    f.des.delete();f.gray.delete();card.delete();src.delete();return;
  }
  const th=+$('th').value,dt=+$('dt').value/100;
  const res=[];
  groups.forEach((g,gi)=>{
    let bestD=1,bestI=0,bestH=null,bestR=null;
    g.samples.forEach(r=>{
      const al=align(f,r);
      if(al.H&&al.inl>=th){
        const d=diffFrac(f.gray,r.gray,al.H,false);
        if(d<bestD){bestD=d;bestI=al.inl;if(bestH)bestH.delete();bestH=al.H;bestR=r;}else al.H.delete();
      }else{if(al.H)al.H.delete();if(al.inl>bestI&&bestD===1)bestI=al.inl;}
    });
    res.push({gi,d:bestD,inl:bestI,H:bestH,r:bestR});
  });
  res.sort((x,y)=>x.d-y.d);
  const best=res[0];
  const ctxD=$('cDiff').getContext('2d');ctxD.clearRect(0,0,$('cDiff').width,$('cDiff').height);
  if(best&&best.H)diffFrac(f.gray,best.r.gray,best.H,true);
  res.forEach(x=>{if(x.H)x.H.delete();});
  const top=res.slice(0,3).map(x=>`G${groups[x.gi].id}: ${x.inl}inl/${x.d<1?Math.round(x.d*100)+'%':'—'}`).join('  ');
  const ms=Math.round(performance.now()-t0);
  let gi,isNew;
  if(best&&best.d<=dt){
    gi=best.gi;isNew=false;const g=groups[gi];g.count++;
    if(g.samples.length<MAX_SAMPLES)g.samples.push(f);
    R.className='match';
    R.innerHTML=`REPEAT → Group ${g.id}${g.name?' ('+g.name+')':''}<div id="detail">diff ${Math.round(best.d*100)}% (max ${Math.round(dt*100)}%) · ${best.inl} inliers · ${ms} ms · edges ${detected?'found':'NOT found'}<br>${top}</div>`;
  }else{
    const id=groups.length?Math.max(...groups.map(g=>g.id))+1:1;
    groups.push({id,name:'',count:1,samples:[f],thumb:thumb(card)});
    gi=groups.length-1;isNew=true;
    R.className='new';
    R.innerHTML=`NEW CARD → Group ${id}<div id="detail">closest: ${best?(best.d<1?Math.round(best.d*100)+'% diff':'no alignment'):'first card'} (max ${Math.round(dt*100)}%) · ${f.pts.length} kp · ${ms} ms · edges ${detected?'found':'NOT found'}<br>${top}</div>`;
  }
  history.push({gid:groups[gi].id,isNew,f});
  log(`${isNew?'NEW':'MATCH'} G${groups[gi].id} kp=${f.pts.length} ${ms}ms | ${top||'first'}`);
  card.delete();src.delete();
  render(groups[gi].id);
}
function render(hit){
  const el=$('groups');el.innerHTML='';
  groups.forEach(g=>{
    const d=document.createElement('div');d.className='g'+(g.id===hit?' hit':'');
    d.innerHTML=`<div class="n">${g.id}</div><img src="${g.thumb}"><div class="c">${g.count} card${g.count>1?'s':''}</div>`;
    const i=document.createElement('input');i.placeholder='label';i.value=g.name;i.oninput=e=>{g.name=e.target.value;};
    d.appendChild(i);el.appendChild(d);
  });
  $('gcount').textContent=groups.length;
  $('total').textContent=groups.reduce((a,g)=>a+g.count,0);
}
$('undo').onclick=()=>{
  const h=history.pop();if(!h)return;
  const gi=groups.findIndex(g=>g.id===h.gid);if(gi<0)return;
  const g=groups[gi];
  if(h.isNew){groups.splice(gi,1);}
  else{g.count--;const si=g.samples.indexOf(h.f);if(si>0){g.samples.splice(si,1);}}
  $('result').className='';$('result').textContent='Undid last scan';log('UNDO G'+h.gid);render();
};
$('forceNew').onclick=()=>{
  const h=history[history.length-1];if(!h||h.isNew)return;
  const g=groups.find(x=>x.id===h.gid);g.count--;
  const si=g.samples.indexOf(h.f);if(si>0)g.samples.splice(si,1);
  const id=Math.max(...groups.map(x=>x.id))+1;
  groups.push({id,name:'',count:1,samples:[h.f],thumb:$('cWarp').toDataURL('image/jpeg',0.8)});
  h.gid=id;h.isNew=true;
  $('result').className='new';$('result').textContent='Moved last card → new Group '+id;log('FORCE NEW G'+id);render(id);
};
$('reset').onclick=()=>{
  if(!confirm('Clear all groups?'))return;
  groups=[];history=[];
  $('result').className='';$('result').textContent='Reset. Take a photo to begin';render();log('RESET');
};
</script>
</body>
</html>
