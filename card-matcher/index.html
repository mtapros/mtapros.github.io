<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Card Matcher v3.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#111;color:#eee}
header{padding:12px 16px;background:#1c1c1c;border-bottom:1px solid #333}
header h1{font-size:18px;margin:0}
#stat{font-size:12px;color:#aaa;margin-top:4px}
main{padding:12px 16px;max-width:900px;margin:auto}
.btn{display:block;width:100%;padding:18px;font-size:20px;font-weight:700;border:0;border-radius:12px;background:#2d7ef7;color:#fff;margin:8px 0;cursor:pointer}
.btn:disabled{background:#444;color:#888}
.row{display:flex;gap:8px}
.row .btn{font-size:15px;padding:12px;background:#333}
#unsureRow{display:none}
#unsureRow .btn{background:#a06a00}
#result{margin:12px 0;padding:16px;border-radius:12px;background:#222;font-size:22px;font-weight:700;text-align:center;min-height:64px}
#result.new{background:#1f6f3f}
#result.match{background:#2d4f9f}
#result.unsure{background:#8a6400}
#result.fail{background:#8a2c2c}
.detail{font-size:13px;color:#ddd;font-weight:400;margin-top:6px}
#views{display:flex;gap:8px;margin:10px 0}
#views div{flex:1;text-align:center;font-size:12px;color:#999}
#views canvas{width:100%;max-height:240px;object-fit:contain;background:#000;border-radius:8px}
#groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.g{background:#222;border-radius:10px;padding:8px;text-align:center;border:2px solid transparent}
.g.hit{border-color:#ffcc00}
.g img{width:100%;border-radius:6px}
.g .n{font-size:22px;font-weight:800}
.g .c{font-size:13px;color:#aaa}
label{font-size:13px;color:#bbb;display:block;margin-top:8px}
input[type=range]{width:100%}
#log{font-family:monospace;font-size:11px;color:#888;white-space:pre-wrap;max-height:200px;overflow:auto;background:#0a0a0a;padding:8px;border-radius:8px}
h2{font-size:15px;margin:18px 0 6px;color:#ccc}
details{margin-top:10px;color:#bbb}
</style>
</head>
<body>
<header><h1>Card Matcher v3.1 · region-based AI matching</h1><div id="stat">Loading OpenCV + AI model (first load ~30–90 MB, cached after)…</div></header>
<main>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<button class="btn" id="snap" disabled>📷 Photograph Card</button>
<div class="row" id="unsureRow">
<button class="btn" id="acceptBest">Yes, it's Group ?</button>
<button class="btn" id="makeNew">No, new card</button>
</div>
<div class="row">
<button class="btn" id="undo">Undo last</button>
<button class="btn" id="reset">Reset all</button>
</div>
<div id="result">Take a photo of a card to begin</div>
<div id="views">
<div><canvas id="cIn"></canvas>Outline</div>
<div><canvas id="cWarp"></canvas>Flattened</div>
<div><canvas id="cMap"></canvas>Mismatch vs closest</div>
</div>
<details>
<summary>Tuning</summary>
<label>Region similarity needed to count as matching: <b id="ptv">0.55</b></label>
<input type="range" id="pt" min="20" max="90" value="55">
<label>REPEAT if largest mismatched blob ≤ <b id="rmv">4</b>% of card</label>
<input type="range" id="rm" min="1" max="20" value="4">
<label>NEW if largest mismatched blob ≥ <b id="nmv">10</b>% of card (between = UNSURE)</label>
<input type="range" id="nm" min="2" max="40" value="10">
<label><input type="checkbox" id="useDetect" checked> Auto-detect card edges</label>
</details>
<h2>Groups (<span id="gcount">0</span>) · Cards: <span id="total">0</span> · Unsure: <span id="unsureCount">0</span></h2>
<div id="groups"></div>
<h2>Log</h2>
<div id="log"></div>
</main>
<script>
window.cvReady=new Promise(res=>{window._cvRes=res;});
function _cvLoaded(){
  if(typeof cv!=='undefined'&&cv instanceof Promise){cv.then(m=>{window.cv=m;window._cvRes();});}
  else if(typeof cv!=='undefined'&&cv.Mat){window._cvRes();}
  else{cv['onRuntimeInitialized']=()=>window._cvRes();}
}
</script>
<script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="_cvLoaded()"></script>
<script type="module">
import { AutoModel, Tensor, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';
env.allowLocalModels=false;
const GW=16,GH=16,PW=GW*14,PH=GH*14,NP=GW*GH,DIM=384,W=400,H=560,MAXDIM=1200,MAX_SAMPLES=5;
const MEAN=[0.485,0.456,0.406],STD=[0.229,0.224,0.225];
const $=id=>document.getElementById(id);
let model=null,groups=[],history=[],pending=null,unsureCount=0,busy=false;
function log(s){$('log').textContent=new Date().toLocaleTimeString()+'  '+s+'\n'+$('log').textContent;}
function stat(s){$('stat').textContent=s;}
function errStr(e){
  if(e==null)return 'unknown error ('+String(e)+')';
  if(typeof e==='number')return 'AI engine crash code '+e+' (likely out of memory or unsupported model input)';
  if(typeof e==='string')return e;
  return (e.message||e.name||JSON.stringify(e)||String(e));
}
function errFull(e){return errStr(e)+(e&&e.stack?'\n'+e.stack:'');}
['pt','rm','nm'].forEach(id=>{$(id).oninput=e=>{$(id+'v').textContent=id==='pt'?(e.target.value/100).toFixed(2):e.target.value;};});
async function init(){
  try{
    stat('Loading AI model…');
    try{model=await AutoModel.from_pretrained('Xenova/dinov2-small',{dtype:'q8'});}
    catch(e){log('q8 load failed, trying fp32: '+errFull(e));model=await AutoModel.from_pretrained('Xenova/dinov2-small',{dtype:'fp32'});}
    stat('Waiting for OpenCV…');
    await window.cvReady;
    stat('Ready');$('snap').disabled=false;log('Ready: DINOv2-small + OpenCV (input 224x224)');
  }catch(e){stat('MODEL LOAD FAILED: '+errStr(e));log('LOAD ERROR '+errFull(e));}
}
init();
$('snap').onclick=()=>{if(!busy)$('file').click();};
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();
  img.onload=async()=>{busy=true;$('snap').disabled=true;try{await processImg(img);}catch(err){log('ERROR '+errFull(err));$('result').className='fail';$('result').innerHTML='Error<div class="detail">'+errStr(err)+'</div>';}busy=false;$('snap').disabled=false;URL.revokeObjectURL(img.src);$('file').value='';};
  img.src=URL.createObjectURL(f);
};
function orderPts(p){
  const s=p.map(q=>q.x+q.y),d=p.map(q=>q.y-q.x);
  return [p[s.indexOf(Math.min(...s))],p[d.indexOf(Math.min(...d))],p[s.indexOf(Math.max(...s))],p[d.indexOf(Math.max(...d))]];
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function findCard(src){
  const g=new cv.Mat(),e=new cv.Mat(),cs=new cv.MatVector(),hi=new cv.Mat();
  cv.cvtColor(src,g,cv.COLOR_RGBA2GRAY);cv.GaussianBlur(g,g,new cv.Size(5,5),0);cv.Canny(g,e,40,120);
  const k=cv.getStructuringElement(cv.MORPH_RECT,new cv.Size(5,5));cv.dilate(e,e,k);
  cv.findContours(e,cs,hi,cv.RETR_EXTERNAL,cv.CHAIN_APPROX_SIMPLE);
  const minA=src.rows*src.cols*0.08;let best=null,bestA=0;
  for(let i=0;i<cs.size();i++){
    const c=cs.get(i),a=cv.contourArea(c);
    if(a<minA||a<=bestA){c.delete();continue;}
    const ap=new cv.Mat();cv.approxPolyDP(c,ap,0.02*cv.arcLength(c,true),true);
    let pts;
    if(ap.rows===4&&cv.isContourConvex(ap)){pts=[];for(let j=0;j<4;j++)pts.push({x:ap.data32S[j*2],y:ap.data32S[j*2+1]});}
    else{pts=cv.RotatedRect.points(cv.minAreaRect(c)).map(q=>({x:q.x,y:q.y}));}
    best=pts;bestA=a;ap.delete();c.delete();
  }
  g.delete();e.delete();cs.delete();hi.delete();k.delete();
  return best?orderPts(best):null;
}
function warpCard(src,pts){
  const [tl,tr,br,bl]=pts,landscape=dist(tl,tr)>dist(tl,bl);
  const dw=landscape?H:W,dh=landscape?W:H;
  const sM=cv.matFromArray(4,1,cv.CV_32FC2,[tl.x,tl.y,tr.x,tr.y,br.x,br.y,bl.x,bl.y]);
  const dM=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,dw,0,dw,dh,0,dh]);
  const M=cv.getPerspectiveTransform(sM,dM),out=new cv.Mat();
  cv.warpPerspective(src,out,M,new cv.Size(dw,dh));sM.delete();dM.delete();M.delete();
  if(landscape)cv.rotate(out,out,cv.ROTATE_90_CLOCKWISE);
  return out;
}
async function embed(canvas){
  const c=document.createElement('canvas');c.width=PW;c.height=PH;
  const x=c.getContext('2d');x.drawImage(canvas,0,0,PW,PH);
  const px=x.getImageData(0,0,PW,PH).data,n=PW*PH,data=new Float32Array(3*n);
  for(let i=0;i<n;i++){for(let ch=0;ch<3;ch++){data[ch*n+i]=(px[i*4+ch]/255-MEAN[ch])/STD[ch];}}
  let out;
  try{out=await model({pixel_values:new Tensor('float32',data,[1,3,PH,PW])});}
  catch(e){throw new Error('AI model failed on this photo: '+errStr(e));}
  const hs=out.last_hidden_state;
  if(!hs)throw new Error('Model returned no last_hidden_state; keys: '+Object.keys(out).join(','));
  const T=hs.dims[1],D=hs.dims[2],src=hs.data,off=T-NP;
  if(D!==DIM||off<0)throw new Error('Unexpected model output '+hs.dims.join('x'));
  const v=new Float32Array(NP*DIM);
  for(let p=0;p<NP;p++){
    let s=0;const b=(off+p)*D;
    for(let k=0;k<D;k++){const t=src[b+k];s+=t*t;}
    s=1/Math.sqrt(s||1);
    for(let k=0;k<D;k++)v[p*DIM+k]=src[b+k]*s;
  }
  return v;
}
function simMap(q,r,flip){
  const S=new Float32Array(NP);
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
    const qi=(y*GW+x)*DIM;let best=-1;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      let ry=y+dy,rx=x+dx;if(ry<0||rx<0||ry>=GH||rx>=GW)continue;
      if(flip){ry=GH-1-ry;rx=GW-1-rx;}
      const ri=(ry*GW+rx)*DIM;let d=0;
      for(let k=0;k<DIM;k++)d+=q[qi+k]*r[ri+k];
      if(d>best)best=d;
    }
    S[y*GW+x]=best;
  }
  return S;
}
function largestBlob(S,th){
  const bad=new Uint8Array(NP),seen=new Uint8Array(NP);
  for(let i=0;i<NP;i++)bad[i]=S[i]<th?1:0;
  let best=0;
  for(let i=0;i<NP;i++){
    if(!bad[i]||seen[i])continue;
    let size=0;const st=[i];seen[i]=1;
    while(st.length){
      const p=st.pop();size++;const y=Math.floor(p/GW),x=p%GW;
      [[y-1,x],[y+1,x],[y,x-1],[y,x+1]].forEach(([yy,xx])=>{
        if(yy<0||xx<0||yy>=GH||xx>=GW)return;const j=yy*GW+xx;
        if(bad[j]&&!seen[j]){seen[j]=1;st.push(j);}
      });
    }
    if(size>best)best=size;
  }
  return best/NP;
}
function mean(S){let s=0;for(let i=0;i<NP;i++)s+=S[i];return s/NP;}
function drawMap(S,th){
  const c=$('cMap');c.width=GW*12;c.height=Math.round(GH*12*1.4);const x=c.getContext('2d');const ch=c.height/GH;
  for(let i=0;i<NP;i++){
    const v=S[i],yy=Math.floor(i/GW),xx=i%GW;
    if(v<th){const a=Math.min(1,(th-v)/0.3+0.3);x.fillStyle=`rgba(255,40,40,${a})`;}
    else{const g=Math.round(40+(v-th)/(1-th+1e-6)*120);x.fillStyle=`rgb(0,${g},40)`;}
    x.fillRect(xx*12,yy*ch,12,ch+1);
  }
}
function thumbURL(){const t=document.createElement('canvas');t.width=200;t.height=280;t.getContext('2d').drawImage($('cWarp'),0,0,200,280);return t.toDataURL('image/jpeg',0.8);}
async function processImg(img){
  const t0=performance.now();
  $('unsureRow').style.display='none';pending=null;
  if(!model)throw new Error('AI model is not loaded yet (see status at top)');
  const sc=Math.min(1,MAXDIM/Math.max(img.width,img.height));
  const cIn=$('cIn');cIn.width=Math.round(img.width*sc);cIn.height=Math.round(img.height*sc);
  const ctx=cIn.getContext('2d');ctx.drawImage(img,0,0,cIn.width,cIn.height);
  const src=cv.imread(cIn);
  let pts=$('useDetect').checked?findCard(src):null;const detected=!!pts;
  if(!pts)pts=[{x:0,y:0},{x:src.cols,y:0},{x:src.cols,y:src.rows},{x:0,y:src.rows}];
  const card=warpCard(src,pts);cv.imshow($('cWarp'),card);card.delete();src.delete();
  ctx.strokeStyle=detected?'#00ff66':'#ff3333';ctx.lineWidth=6;ctx.beginPath();
  pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.stroke();
  $('result').className='';$('result').textContent='Analyzing…';
  const v=await embed($('cWarp'));
  const th=$('pt').value/100,rmax=$('rm').value/100,nmin=$('nm').value/100;
  const res=groups.map((g,gi)=>{
    let flip=false;
    const s0=simMap(v,g.samples[0],false),s1=simMap(v,g.samples[0],true);
    if(mean(s1)>mean(s0))flip=true;
    let bestBlob=1,bestMean=0,bestS=null;
    g.samples.forEach((r,ri)=>{
      const S=ri===0?(flip?s1:s0):simMap(v,r,flip);
      const b=largestBlob(S,th),m=mean(S);
      if(b<bestBlob||(b===bestBlob&&m>bestMean)){bestBlob=b;bestMean=m;bestS=S;}
    });
    return {gi,blob:bestBlob,mean:bestMean,S:bestS};
  }).sort((a,b)=>a.blob-b.blob||b.mean-a.mean);
  const best=res[0],ms=Math.round(performance.now()-t0);
  const top=res.slice(0,3).map(r=>`G${groups[r.gi].id}: blob ${(r.blob*100).toFixed(1)}% · sim ${r.mean.toFixed(2)}`).join('<br>');
  if(best)drawMap(best.S,th);else{const c=$('cMap');c.getContext('2d').clearRect(0,0,c.width,c.height);}
  const info=`${ms} ms · edges ${detected?'found':'NOT found'}<br>${top||'first card'}`;
  const R=$('result');
  if(!best||best.blob>=nmin){
    const g=newGroup(v);history.push({type:'new',gid:g.id});
    R.className='new';R.innerHTML=`NEW CARD → Group ${g.id}<div class="detail">${info}</div>`;
    log(`NEW G${g.id} ${ms}ms | ${top.replace(/<br>/g,' | ')}`);render(g.id);
  }else if(best.blob<=rmax){
    const g=groups[best.gi];addToGroup(g,v);history.push({type:'add',gid:g.id,v});
    R.className='match';R.innerHTML=`REPEAT → Group ${g.id}<div class="detail">${info}</div>`;
    log(`REPEAT G${g.id} ${ms}ms | ${top.replace(/<br>/g,' | ')}`);render(g.id);
  }else{
    const g=groups[best.gi];pending={v,gid:g.id};unsureCount++;
    R.className='unsure';R.innerHTML=`UNSURE — maybe Group ${g.id}?<div class="detail">(on the sorter this goes to the reject bin)<br>${info}</div>`;
    $('acceptBest').textContent=`Yes, it's Group ${g.id}`;$('unsureRow').style.display='flex';
    log(`UNSURE ~G${g.id} ${ms}ms | ${top.replace(/<br>/g,' | ')}`);render(g.id);
  }
}
function newGroup(v){const id=groups.length?Math.max(...groups.map(g=>g.id))+1:1;const g={id,count:1,samples:[v],thumb:thumbURL()};groups.push(g);return g;}
function addToGroup(g,v){g.count++;if(g.samples.length<MAX_SAMPLES)g.samples.push(v);}
$('acceptBest').onclick=()=>{if(!pending)return;const g=groups.find(x=>x.id===pending.gid);addToGroup(g,pending.v);history.push({type:'add',gid:g.id,v:pending.v});log('USER: unsure → G'+g.id);$('result').className='match';$('result').textContent='Added to Group '+g.id;pending=null;$('unsureRow').style.display='none';render(g.id);};
$('makeNew').onclick=()=>{if(!pending)return;const g=newGroup(pending.v);history.push({type:'new',gid:g.id});log('USER: unsure → NEW G'+g.id);$('result').className='new';$('result').textContent='Created Group '+g.id;pending=null;$('unsureRow').style.display='none';render(g.id);};
$('undo').onclick=()=>{
  const h=history.pop();if(!h)return;const gi=groups.findIndex(g=>g.id===h.gid);if(gi<0)return;const g=groups[gi];
  if(h.type==='new')groups.splice(gi,1);else{g.count--;const si=g.samples.indexOf(h.v);if(si>0)g.samples.splice(si,1);}
  $('result').className='';$('result').textContent='Undid last';log('UNDO G'+h.gid);render();
};
$('reset').onclick=()=>{if(!confirm('Clear all groups?'))return;groups=[];history=[];pending=null;unsureCount=0;$('unsureRow').style.display='none';$('result').className='';$('result').textContent='Reset';render();log('RESET');};
function render(hit){
  const el=$('groups');el.innerHTML='';
  groups.forEach(g=>{const d=document.createElement('div');d.className='g'+(g.id===hit?' hit':'');d.innerHTML=`<div class="n">${g.id}</div><img src="${g.thumb}"><div class="c">${g.count} card${g.count>1?'s':''}</div>`;el.appendChild(d);});
  $('gcount').textContent=groups.length;$('total').textContent=groups.reduce((a,g)=>a+g.count,0);$('unsureCount').textContent=unsureCount;
}
</script>
</body>
</html>
